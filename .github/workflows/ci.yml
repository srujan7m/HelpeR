name: Translation CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  translation-validation:
    runs-on: ubuntu-latest
    name: Extract & Validate Translations

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract translatable strings
        run: pnpm i18n:extract

      - name: Validate translations
        run: pnpm i18n:validate
        env:
          NODE_ENV: production

      - name: Check for missing translations
        run: |
          if [ ! -f "locales/en.json" ]; then
            echo "ERROR: No source translations found!"
            exit 1
          fi
          echo "Translation files validated"

  build-and-test:
    runs-on: ubuntu-latest
    needs: translation-validation
    name: Build Application

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Extract & Translate
        run: |
          pnpm i18n:extract
          if [ -n "$LINGO_API_KEY" ] || [ -n "$TRANSLATION_API_KEY" ]; then
            pnpm i18n:translate
          else
            echo "WARN: Translation API key not set. Skipping auto-translation."
          fi
        env:
          LINGO_API_KEY: ${{ secrets.LINGO_API_KEY }}
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}

      - name: Build Next.js
        run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
